<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 300px; margin: 0; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117; color: #e7e9ee;
    }
    h1 { font-size: 15px; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
    p.sub { font-size: 12px; color: #7c8299; margin: 0 0 14px; }
    label { font-size: 12px; color: #a9b1c6; display: block; margin-bottom: 4px; }
    input, textarea {
      width: 100%; box-sizing: border-box; background: #171a21; color: #e7e9ee;
      border: 1px solid #23262f; border-radius: 8px; padding: 8px 10px;
      font-size: 13px; margin-bottom: 10px; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 48px; }
    button {
      width: 100%; background: #6366f1; color: #fff; border: none;
      border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    button.secondary { background: #23262f; margin-top: 8px; }
    .status { font-size: 12px; margin-top: 10px; text-align: center; min-height: 16px; }
    .ok { color: #4ade80; } .err { color: #f87171; }
    .field-url { font-size: 11px; color: #7c8299; word-break: break-all; margin-bottom: 12px; }
    .settings { margin-top: 12px; border-top: 1px solid #23262f; padding-top: 10px; }
  </style>
</head>
<body>
  <h1>📚 Save to StudyWorks</h1>
  <p class="sub">Clip this page into your notes.</p>

  <label for="title">Title</label>
  <input id="title" type="text" />

  <div class="field-url" id="url"></div>

  <label for="note">Note (optional)</label>
  <textarea id="note" placeholder="Add a thought…"></textarea>

  <button id="save">Save to StudyWorks</button>
  <button id="openApp" class="secondary">Open StudyWorks</button>

  <div class="status" id="status"></div>

  <div class="settings">
    <label for="base">StudyWorks URL</label>
    <input id="base" type="text" placeholder="http://localhost:5173" />
  </div>

  <script src="popup.js"></script>
</body>
</html>
