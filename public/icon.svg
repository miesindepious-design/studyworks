<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B241C"/>
      <stop offset="1" stop-color="#171310"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.15" y1="1" x2="0.85" y2="0">
      <stop offset="0" stop-color="#FF5136"/>
      <stop offset="1" stop-color="#FFC531"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FF7A3D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF7A3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded tile (transparent outside the corners) -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <!-- Hairline inner edge for a premium tile feel -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>

  <!-- Soft glow behind the mark -->
  <circle cx="256" cy="248" r="168" fill="url(#glow)"/>

  <!-- Sprout: stem, two leaves, bowl base -->
  <g fill="none" stroke="url(#mark)" stroke-linecap="round">
    <!-- stem -->
    <path d="M256 386 C 256 336 250 286 256 218" stroke-width="32"/>
  </g>
  <g fill="url(#mark)">
    <!-- left leaf -->
    <path d="M254 262 C 208 266 168 238 158 180 C 220 176 249 214 254 262 Z"/>
    <!-- right leaf -->
    <path d="M258 216 C 304 220 344 192 354 134 C 292 130 263 168 258 216 Z"/>
  </g>
</svg>
