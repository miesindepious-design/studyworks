<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B241C"/>
      <stop offset="1" stop-color="#171310"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.15" y1="1" x2="0.85" y2="0">
      <stop offset="0" stop-color="#FF5136"/>
      <stop offset="1" stop-color="#FFC531"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FF7A3D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF7A3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed tile for maskable / apple-touch usage -->
  <rect width="512" height="512" fill="url(#tile)"/>

  <circle cx="256" cy="248" r="150" fill="url(#glow)"/>

  <!-- Sprout scaled into the maskable safe zone (80% circle) -->
  <g fill="none" stroke="url(#mark)" stroke-linecap="round">
    <path d="M256 374 C 256 332 250 292 256 234" stroke-width="28"/>
  </g>
  <g fill="url(#mark)">
    <path d="M254 270 C 214 273 179 249 170 198 C 224 194 249 228 254 270 Z"/>
    <path d="M258 230 C 298 233 333 209 342 158 C 288 154 263 188 258 230 Z"/>
  </g>
</svg>
