<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="stylesheet" href="/src/App.css" />
    <link rel="stylesheet" href="/src/compat.css" />
    <link rel="stylesheet" href="/src/design.css" />
    <title>Note card overflow repro</title>
    <style>
      /* Mimic the app shell: a fixed-width main column like the real app. */
      .repro-main { width: 640px; padding: 24px; }
    </style>
  </head>
  <body>
    <div class="repro-main">
      <div class="grid stagger">
        <div class="card" data-testid="note-card">
          <div style="margin-bottom:0.5rem;display:flex;gap:0.375rem;flex-wrap:wrap;align-items:center">
            <span class="tag danger">note</span>
          </div>

          <h3 data-testid="note-title" style="font-weight:700;margin-bottom:0.5rem">Limits_of_Functions_Lecture_Note</h3>

          <div style="margin-bottom:0.75rem">
            <p class="text-sm text-muted" style="white-space:pre-wrap"></p>
            <p class="text-xs text-muted" style="margin-top:0.375rem">0 words &middot; 1 min read</p>
          </div>

          <div class="note-card-actions" data-testid="note-actions">
            <button class="btn btn-ghost btn-xs">&#9997;&#65039; Edit</button>
            <button class="btn btn-ghost btn-xs">&#129704; Focus</button>
            <button class="btn btn-ghost btn-xs">&#10024; Summary</button>
            <button class="btn btn-ghost btn-xs">&#128221; Flashcards</button>
            <button class="btn btn-ghost btn-xs">&#128293; Harder set</button>
            <button class="btn btn-ghost btn-xs">&#129504; Practice Qs</button>
            <button class="btn btn-ghost btn-xs">&#9200;</button>
            <button class="btn btn-ghost btn-xs">&#9660; More</button>
            <button class="btn btn-ghost btn-xs">&#128340; History</button>
            <button class="btn btn-ghost btn-xs">&#128228;</button>
            <button class="btn btn-danger btn-xs">&#128465;</button>
          </div>

          <div style="margin-top:0.75rem;display:flex;flex-wrap:wrap;gap:0.25rem">
            <span class="tag">imported</span>
          </div>
          <p class="text-xs text-muted" style="margin-top:0.375rem">
            11/16/2026 &middot; 0 words &middot; 1 min read &middot; 1 tags &middot; 0 highlights
          </p>
        </div>
      </div>
    </div>

    <script type="module">
      // Report overflow measurements so the fix can be verified objectively.
      const card = document.querySelector('[data-testid="note-card"]');
      const title = document.querySelector('[data-testid="note-title"]');
      const actions = document.querySelector('[data-testid="note-actions"]');
      const cs = getComputedStyle(card);
      window.__measure = () => ({
        card: { client: card.clientWidth, scroll: card.scrollWidth, rect: Math.round(card.getBoundingClientRect().width) },
        title: { client: title.clientWidth, scroll: title.scrollWidth, rect: Math.round(title.getBoundingClientRect().width) },
        actions: { client: actions.clientWidth, scroll: actions.scrollWidth, rect: Math.round(actions.getBoundingClientRect().width) },
        cardOverflowX: cs.overflowX,
        gridWidth: Math.round(document.querySelector('.grid').getBoundingClientRect().width),
        gridCols: getComputedStyle(document.querySelector('.grid')).gridTemplateColumns,
        bodyScroll: document.body.scrollWidth,
        bodyClient: document.body.clientWidth,
      });
      document.title = 'ready';
    </script>
  </body>
</html>
